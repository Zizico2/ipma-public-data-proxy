[workspace]
members = ["crates/*"]
default-members = ["crates/ipma-public-data-proxy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
ipma-public-data-client = { git = "https://github.com/Zizico2/ipma-openapi.git", rev = "3f0239c3a7b354a56b1f0b3c4d2b1a8b0321085a" }
ipma-public-data-proto = { git = "https://github.com/Zizico2/ipma-public-data-proto.git", rev = "cabad92076b69be09eedb164c3776035f5463934" }
ipma-public-data-service = { path = "crates/ipma-public-data-service", version = "0.1.0" }

anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
flate2 = "1"
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "http2"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-reflection = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
